name: cleanupStaleServers

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Si true, liste les instances à détruire sans les détruire réellement'
        type: string
        required: false
        default: 'false'
    secrets:
      AWS_KEY_ID:
        required: true
      AWS_ACCESS_KEY:
        required: true
      GHP_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Si true, liste les instances à détruire sans les détruire réellement'
        type: boolean
        required: false
        default: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Create AWS config credential folder
        run: mkdir -p /home/runner/.aws

      - name: Create AWS config region file
        uses: 1arp/create-a-file-action@0.4.6
        with:
          path: '/home/runner/.aws'
          isAbsolutePath: true
          file: 'config'
          content: |
            [default]
            region = eu-west-1

      - name: Create AWS config credential file
        uses: 1arp/create-a-file-action@0.4.6
        with:
          path: '/home/runner/.aws'
          isAbsolutePath: true
          file: 'credentials'
          content: |
            [default]
            aws_access_key_id = ${{ secrets.AWS_KEY_ID }}
            aws_secret_access_key = ${{ secrets.AWS_ACCESS_KEY }}
            region = eu-west-1

      - name: Lister les instances actives
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          bonitaAwsVersion="1.8"
          gh release download bonita-aws-${bonitaAwsVersion} \
            --repo laurentleseigneur/bonita-aws \
            --pattern "*-jar-with-dependencies.jar"
          java -jar bonita-aws-${bonitaAwsVersion}-jar-with-dependencies.jar \
          -c list \
          --key-name presale-ci-eu-west-1

      - name: Identifier les instances dont le TTL est dépassé
        id: identify
        run: |
          python3 << 'EOF'
          import yaml
          from datetime import datetime, timezone

          with open("instances.yaml") as f:
              data = yaml.safe_load(f)
          instances = [i for group in (data or []) for i in (group or [])]

          def get_tag(tags, key):
              for t in (tags or []):
                  if t.get("key") == key:
                      return t.get("value", "")
              return ""

          now = datetime.now(timezone.utc)
          to_delete = []

          for i in instances:
              if (i.get("state") or {}).get("name") != "running":
                  continue
              name = get_tag(i.get("tags"), "Name") or get_tag(i.get("tags"), "bcd:stackId")
              if get_tag(i.get("tags"), "ofelia:skipLicenseCheck") == "true":
                  print(f"  {name} : exclu (ofelia:skipLicenseCheck=true)")
                  continue
              expires_at_raw = get_tag(i.get("tags"), "presales:expires-at")
              if not expires_at_raw:
                  print(f"  {name} : pas de presales:expires-at -- ignorée (à retagger manuellement si c'est un oubli)")
                  continue
              try:
                  expires_at = datetime.fromisoformat(expires_at_raw.replace("Z", "+00:00"))
              except ValueError:
                  print(f"  {name} : presales:expires-at illisible ('{expires_at_raw}') -- ignorée par prudence")
                  continue
              if now > expires_at:
                  print(f"  {name} : TTL dépassé ({expires_at_raw}) -- candidate à la destruction")
                  to_delete.append(name)
              else:
                  print(f"  {name} : TTL encore valide jusqu'à {expires_at_raw}")

          with open("to_delete.txt", "w") as f:
              f.write("\n".join(to_delete))

          print(f"\n{len(to_delete)} instance(s) à détruire.")
          EOF

      - name: Détruire les instances dont le TTL est dépassé
        env:
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
        run: |
          bonitaAwsVersion="1.8"
          DRY_RUN="${{ inputs.dry_run }}"
          while IFS= read -r stackId; do
            [ -z "$stackId" ] && continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry-run] aurait détruit : $stackId"
            else
              echo "Destruction de $stackId"
              java -jar bonita-aws-${bonitaAwsVersion}-jar-with-dependencies.jar \
              -c delete \
              --stack-id "$stackId" \
              --key-name presale-ci-eu-west-1
            fi
          done < to_delete.txt

      - name: Résumé
        run: |
          DRY_RUN="${{ inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            MODE="DRY-RUN (aucune destruction réelle)"
          else
            MODE="RÉEL"
          fi
          echo "## Nettoyage centralisé TTL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow : \`${GITHUB_WORKFLOW}\` — étape \`Résumé\` — ref \`${GITHUB_WORKFLOW_REF:-$GITHUB_REF}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Mode : ${MODE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -s to_delete.txt ]; then
            echo "| Stack ID |" >> $GITHUB_STEP_SUMMARY
            echo "| --- |" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r stackId; do
              [ -z "$stackId" ] && continue
              echo "| \`${stackId}\` |" >> $GITHUB_STEP_SUMMARY
            done < to_delete.txt
          else
            echo "Aucune instance concernée." >> $GITHUB_STEP_SUMMARY
          fi
